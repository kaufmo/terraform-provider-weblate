server {
    listen 80;
    root /usr/share/nginx/html;

    # http://git.test.example/private/demo.git needs the credentials from htpasswd. Only the ref discovery asks for
    # them: over dumb HTTP, git drops the credentials of the URL after the first response, and the object downloads
    # that follow would fail with 401. Smart HTTP, which real git hosts use, keeps them.
    location ~ ^/private/.+/info/refs$ {
        auth_basic "git";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
}
