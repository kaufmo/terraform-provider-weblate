name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go test ./...

  docs:
    name: Generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # tfplugindocs reads the provider schema through the Terraform CLI.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Generate and validate docs
        run: go generate ./...
      - name: Check that the generated docs are committed
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
